# APEX — весь стек одной командой: docker compose up -d
#
# Сервисы:
#   caddy    — обратный прокси + автоматический HTTPS (Let's Encrypt)
#   app      — веб-приложение (Next.js): интерфейс, API, OAuth-коллбэки
#   worker   — фоновый обработчик публикаций (загрузка видео в соцсети)
#   postgres — база данных
#   redis    — очередь задач
#
# Данные БД и медиа хранятся в именованных томах и переживают перезапуск.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - media:/app/media
    # Перед стартом синхронизируем схему БД, затем запускаем сервер.
    command: sh -c "npx prisma db push --skip-generate && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - media:/app/media
    command: npm run worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: apex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF: отложенные публикации переживают перезапуск/сбой Redis.
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
